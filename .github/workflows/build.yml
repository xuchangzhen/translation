name: 构建桌面安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: 构建 ${{ runner.os }} 安装包
    strategy:
      matrix:
        include:
          - os: macos-14
            command: build:mac
            artifact: release/*.dmg
          - os: windows-latest
            command: build:win
            artifact: |
              release/*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile
      - name: 检查并构建安装包
        run: pnpm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: 保存安装包
        uses: actions/upload-artifact@v4
        with:
          name: 翻译-${{ runner.os }}
          path: ${{ matrix.artifact }}
