name: 构建桌面安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.os }} 安装包
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: build:mac
            artifact: |
              release/*.dmg
              release/*.zip
              release/*.yml
              release/*.blockmap
          - os: windows-latest
            command: build:win
            artifact: |
              release/*.exe
              release/*.yml
              release/*.blockmap

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile
      - name: 检查并构建安装包
        run: pnpm run ${{ matrix.command }}
      - name: 保存安装包
        uses: actions/upload-artifact@v4
        with:
          name: 翻译-${{ runner.os }}
          path: ${{ matrix.artifact }}

  release:
    name: 发布应用内更新
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
