name: 构建桌面安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.os }} 安装包
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: build:mac
            artifact: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
              release/*.blockmap
          - os: windows-latest
            command: build:win
            artifact: |
              release/*.exe
              release/latest.yml
              release/*.blockmap

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile
      - name: 配置 Apple 公证密钥
        if: matrix.os == 'macos-14'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "缺少 APPLE_API_KEY_BASE64，无法发布可自动更新的 macOS 版本。"
            exit 1
          fi
          apple_key_path="$RUNNER_TEMP/AuthKey.p8"
          if ! printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$apple_key_path"; then
            echo "无法解码 APPLE_API_KEY_BASE64。请确认它是 .p8 文件的 base64 内容。"
            exit 1
          fi
          echo "APPLE_API_KEY=$apple_key_path" >> "$GITHUB_ENV"
      - name: 检查并构建安装包
        run: pnpm run ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: 验证 macOS 签名与公证
        if: matrix.os == 'macos-14'
        run: |
          app_bundle="$(find release -type d -name '*.app' -print -quit)"
          if [ -z "$app_bundle" ]; then
            echo "未找到 macOS app bundle。"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          xcrun stapler validate "$app_bundle"
      - name: 保存安装包
        uses: actions/upload-artifact@v4
        with:
          name: 翻译-${{ runner.os }}
          path: ${{ matrix.artifact }}

  release:
    name: 发布应用内更新
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
